region:
  name: <ENV:REGION_NAME>
worker:
  id: <ENV:WORKER_ID>
  concurrency: <ENV:WORKER_CONCURRENCY>
pb:
  url: <ENV:PB_URL>
  access:
    client_id: <ENV:CF_ACCESS_CLIENT_ID>
    client_secret: <ENV:CF_ACCESS_CLIENT_SECRET>
  admin:
    collection: <ENV:PB_AUTH_COLLECTION>
    username: <ENV:PB_ADMIN_USERNAME>
    password: <ENV:PB_ADMIN_PASSWORD>
