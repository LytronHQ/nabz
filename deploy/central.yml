# Central role (run exactly one, NOT on a zone VM): the evaluator.
# Single source of truth for what runs on the central node.
#
#   docker compose --env-file /etc/monitors/evaluator.env -f deploy/central.yml up -d --build
#
# Values come from the env file (see evaluator.env.example).
name: monitors-central

services:
  evaluator:
    build:
      context: ..
      dockerfile: evaluator/dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      - PB_URL=${PB_URL}
      - PB_AUTH_COLLECTION=${PB_AUTH_COLLECTION:-}
      - PB_ADMIN_USERNAME=${PB_ADMIN_USERNAME}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      # Optional alerting (webhook channels need none of this):
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - OPS_WEBHOOK_URL=${OPS_WEBHOOK_URL:-}
      # External dead-man's switch: unset = off.
      - HEALTHCHECK_PING_URL=${HEALTHCHECK_PING_URL:-}
      - DEADMAN_SECONDS=${DEADMAN_SECONDS:-90}
      - CERT_EXPIRY_WARN_DAYS=${CERT_EXPIRY_WARN_DAYS:-14}
      # Two-tier health endpoint (#103): /health + /health/all (fleet aggregate).
      # HEALTH_ADDR=off disables it; a blank HEALTH_DEBUG_TOKEN keeps only the
      # minimal public tier.
      - HEALTH_ADDR=${HEALTH_ADDR:-:8080}
      - HEALTH_DEBUG_TOKEN=${HEALTH_DEBUG_TOKEN:-}
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/evaluator", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
