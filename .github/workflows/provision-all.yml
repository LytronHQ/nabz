name: provision-all

# Cold start: everything from an empty environment to a deployed fleet, in the
# only order that works. Each step is the standalone workflow, so a partial
# re-run is just running one of them again.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true
      deploy:
        description: Deploy after provisioning
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  credentials:
    uses: ./.github/workflows/bootstrap-credentials.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit

  # Web Push signing keys (#602). Mint-if-missing; a failure here costs only
  # push alerts (the evaluator skips them), so nothing downstream waits on it.
  vapid:
    needs: credentials
    uses: ./.github/workflows/bootstrap-vapid.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit

  hetzner:
    needs: credentials
    uses: ./.github/workflows/infra-hetzner.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit

  # Needs PB_BIND_IP from hetzner.
  tunnel:
    needs: hetzner
    uses: ./.github/workflows/infra-tunnel.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit

  access:
    needs: tunnel
    uses: ./.github/workflows/infra-access.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit

  # BEFORE nodes, not after. remote-deploy.sh does not receive the heartbeat URLs —
  # it looks them up from Better Stack by name and writes them into the evaluator's
  # env file. On a cold start, with watch running afterwards, those heartbeats did
  # not exist yet, so the lookup found nothing and the evaluator was deployed with
  # HEALTHCHECK_PING_URL and PB_MAINTENANCE_PING_URL empty. Both treat unset as
  # "feature off", so the dead-man switch and the maintenance heartbeat were
  # silently disabled on exactly the run that sets an environment up — and only a
  # later redeploy would quietly fix it.
  watch:
    needs: access
    # No EXTERNAL_WATCH test here, deliberately. A job that `uses:` a reusable
    # workflow cannot declare `environment:`, so `vars.*` in its `if:` resolves
    # against REPOSITORY variables — where EXTERNAL_WATCH does not exist. The test
    # that used to live here therefore compared '' against 'off' and passed every
    # time: staging sets EXTERNAL_WATCH=off and was called anyway, on every run.
    #
    # external-watch.sh does the check itself, from the materialized environment
    # where the value is actually visible, and prints why it stopped. That is the
    # one mechanism now, rather than two with only one of them working.
    if: ${{ inputs.deploy }}
    uses: ./.github/workflows/infra-watch.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit

  # Brings PocketBase up and starts the tunnel connectors, so it must precede
  # the web deploy's Access check.
  #
  # The result check is required, not decoration: a skipped `needs` job skips its
  # dependents by default. watch is skipped whenever deploy=false, and was
  # previously skipped for EXTERNAL_WATCH=off too. Keeping the tolerance costs
  # nothing and stops a future guard on `watch` from silently killing the deploy.
  nodes:
    needs: [access, watch, vapid]
    if: ${{ inputs.deploy && !cancelled() && (needs.watch.result == 'success' || needs.watch.result == 'skipped') }}
    uses: ./.github/workflows/deploy-nodes.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit

  web:
    needs: nodes
    if: ${{ inputs.deploy }}
    uses: ./.github/workflows/deploy-web.yml
    with: { environment: "${{ inputs.environment }}" }
    secrets: inherit
