name: infra-watch

# Configures the outside-in monitoring — Better Stack on the public endpoints and
# a Better Stack heartbeat as the evaluator's dead-man's switch. Separate from deploy
# because it changes third-party state, not ours, and rarely needs re-running.
#
# Telegram stays manual: these APIs create monitors, not integrations.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true
  workflow_call:
    inputs:
      environment: { type: string, required: true }

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bws
        uses: ./.github/actions/bws

      - name: Configure Better Stack
        env:
          ENV_NAME: ${{ inputs.environment }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          # Generated by bootstrap-credentials into GitHub, not Bitwarden — the
          # PocketBase probe authenticates with it.
          HEALTH_DEBUG_TOKEN: ${{ secrets.HEALTH_DEBUG_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$BWS_ACCESS_TOKEN" ] || { echo "::error::BWS_ACCESS_TOKEN is not set for this environment"; exit 1; }
          [ -n "$HEALTH_DEBUG_TOKEN" ] || { echo "::error::HEALTH_DEBUG_TOKEN is empty — run bootstrap-credentials for this environment first"; exit 1; }
          # Surface the output in the run summary: on a first run it carries the
          # ping URL, the one value this cannot write back (the machine account is
          # read-only), and hunting it in collapsed log lines is how it gets missed.
          ./deploy/external-watch.sh "$ENV_NAME" | tee /tmp/watch.log
          { echo '```'; cat /tmp/watch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
