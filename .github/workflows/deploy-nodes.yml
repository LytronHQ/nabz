name: deploy-nodes

# Deploys the Hetzner fleet: composes deploy/<env>.env from the environment's
# secrets, then runs remote-deploy.sh over SSH. The only credential this job
# holds is the SSH key — no cloud API tokens.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true
  workflow_call:
    inputs:
      environment: { type: string, required: true }

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # One secret, not a hand-maintained list. Enumerating every value here was a
      # second copy of the manifest: anything added to Bitwarden silently failed
      # to reach the nodes until someone remembered to add a line. The SSH key
      # comes from Bitwarden too — remote-deploy.sh writes it to a temp file.
      - name: Install bws
        uses: ./.github/actions/bws

      # remote-deploy.sh materializes from Bitwarden when there is no local
      # deploy/<env>.env, so the workflow and a laptop run read the same source.
      #
      # Two sets are the deliberate exception, and neither can come from Bitwarden.
      #
      # The infra outputs (NODES, PB_URL, PB_BIND_IP, PB_DATA_DEVICE,
      # PRIVATE_SUBNET) are not configuration anyone chooses — infra-hetzner read
      # them back from the Hetzner API and wrote them here. They override the
      # materialized file, because a rebuilt server changes its IP and a stale
      # copy means SSHing into the wrong host.
      #
      # The generated credentials are written by bootstrap-credentials, straight
      # into GitHub environment secrets so no human ever sees them. That means
      # they are NOT in Bitwarden, so materializing cannot supply them and they
      # have to be passed explicitly — remote-deploy.sh hard-fails on the first
      # three (`${VAR:?}`) when writing pocketbase/worker/evaluator env files.
      - name: Deploy
        env:
          ENV_NAME: ${{ inputs.environment }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          # Pushed from ~/.ssh by setup-env.sh; deliberately not in Bitwarden.
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NODES: ${{ secrets.NODES }}
          PB_URL: ${{ secrets.PB_URL }}
          PB_BIND_IP: ${{ secrets.PB_BIND_IP }}
          PB_DATA_DEVICE: ${{ secrets.PB_DATA_DEVICE }}
          PRIVATE_SUBNET: ${{ secrets.PRIVATE_SUBNET }}
          # Written by infra-tunnel, which ends with "the tunnel stays down until
          # deploy-nodes starts a connector" — this is what starts it.
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          # Generated by bootstrap-credentials; see above.
          PB_SUPERUSER_PASSWORD: ${{ secrets.PB_SUPERUSER_PASSWORD }}
          WORKER_PB_PASSWORD: ${{ secrets.WORKER_PB_PASSWORD }}
          EVALUATOR_PB_PASSWORD: ${{ secrets.EVALUATOR_PB_PASSWORD }}
          HEALTH_DEBUG_TOKEN: ${{ secrets.HEALTH_DEBUG_TOKEN }}
          PKCE_FLOW_ENCRYPTION_KEY: ${{ secrets.PKCE_FLOW_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          [ -n "$BWS_ACCESS_TOKEN" ] || { echo "::error::BWS_ACCESS_TOKEN is not set for this environment"; exit 1; }
          [ -n "$NODES" ] || { echo "::error::NODES is empty — run infra-hetzner for this environment first"; exit 1; }
          # Without this the failure is a `${VAR:?}` from inside a heredoc being
          # written over SSH, which names the variable but not the reason.
          for v in PB_SUPERUSER_PASSWORD WORKER_PB_PASSWORD EVALUATOR_PB_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v is empty — run bootstrap-credentials for this environment first"; exit 1; }
          done
          ./deploy/remote-deploy.sh "$ENV_NAME"
