name: bootstrap-credentials

# Generates every credential the fleet needs that nobody outside it has to know:
# the PocketBase superuser password, both service-account passwords, the PKCE
# key and the health debug token. Writes them straight into the environment's
# secrets, so they are never seen, typed, or pasted by a human.
#
# Run once per environment, before infra-hetzner. Re-running MINTS NEW VALUES and
# they will not match what is already deployed — the accounts would have to be
# reset. It refuses unless you say so explicitly.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true
      confirm_overwrite:
        description: 'Type "overwrite" to replace credentials that already exist'
        type: string
        default: ''
  workflow_call:
    inputs:
      environment: { type: string, required: true }

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Decide once: mint, skip, or refuse.
      #
      # `github.event_name` is the RUN's trigger, so inside a reusable workflow it
      # still reads workflow_dispatch when provision-all was the thing dispatched.
      # The old guard keyed on that alone, so every provision-all re-run aborted at
      # step one with "credentials already exist" — despite provision-all's own
      # header promising "a partial re-run is just running one of them again".
      # `github.workflow` is the top-level workflow's name, which is what actually
      # distinguishes a direct dispatch of THIS workflow from a call by another.
      - name: Decide whether to mint credentials
        id: decide
        env:
          EXISTING: ${{ secrets.PB_SUPERUSER_PASSWORD }}
          CONFIRM: ${{ inputs.confirm_overwrite }}
          DIRECT: ${{ github.workflow == 'bootstrap-credentials' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "$EXISTING" ]; then
            echo "mint=1" >> "$GITHUB_OUTPUT"
            echo "no credentials yet — minting"
          elif [ "$CONFIRM" = "overwrite" ]; then
            echo "mint=1" >> "$GITHUB_OUTPUT"
            echo "confirm_overwrite=overwrite — replacing the existing credentials"
          elif [ "$DIRECT" = "1" ]; then
            # Someone ran THIS workflow deliberately against an environment that
            # already has credentials. New ones would not match the deployed
            # PocketBase accounts, so make them say so.
            echo "::error::Credentials already exist for this environment. New ones would not match"
            echo "::error::the deployed PocketBase accounts. Re-run with confirm_overwrite=overwrite"
            echo "::error::only if you intend to reset them."
            exit 1
          else
            # Called as part of a larger run. Existing credentials are the correct
            # state, not an obstacle: they match the fleet. Skipping is what makes
            # the whole chain re-runnable.
            echo "mint=0" >> "$GITHUB_OUTPUT"
            echo "credentials already exist — keeping them (re-run is a no-op here)"
          fi

      - name: Generate and store
        if: ${{ steps.decide.outputs.mint == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::GH_SECRETS_PAT is not set for this environment"; exit 1; }
          # 32 url-safe bytes. Values go value -> gh secret set without ever
          # being printed; no `set -x` in this job for the same reason.
          gen() { openssl rand -base64 32 | tr -d '/+=' | head -c 40; }
          for name in PB_SUPERUSER_PASSWORD WORKER_PB_PASSWORD EVALUATOR_PB_PASSWORD \
                      PKCE_FLOW_ENCRYPTION_KEY HEALTH_DEBUG_TOKEN; do
            gh secret set "$name" --env "$ENV_NAME" --repo "${{ github.repository }}" --body "$(gen)"
            echo "set $name"
          done
