name: Install bws
description: Bitwarden Secrets Manager CLI, pinned. Every workflow that reads secrets uses this, so the version lives in one place.

inputs:
  version:
    description: bws release to install
    default: "2.1.0"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/bitwarden/sdk-sm/releases/download/bws-v${VERSION}"
        asset="bws-x86_64-unknown-linux-gnu-${VERSION}"
        curl -fsSL -o /tmp/bws.zip "${base}/${asset}.zip"
        # Verify against the published checksums rather than trusting the download:
        # this binary is handed every production secret we have.
        curl -fsSL -o /tmp/bws.sums "${base}/bws-sha256-checksums-${VERSION}.txt"
        want="$(awk -v a="${asset}.zip" '$2 == a || $2 == "*"a {print $1}' /tmp/bws.sums)"
        [ -n "$want" ] || { echo "::error::no checksum published for ${asset}.zip"; exit 1; }
        echo "${want}  /tmp/bws.zip" | sha256sum -c -
        unzip -q -o /tmp/bws.zip -d /usr/local/bin
        chmod +x /usr/local/bin/bws
        bws --version
