<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="256x256" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Blueprint petrol brand (light) / dark surface (dark). -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#123b40" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1719" />
		<meta
			name="description"
			content="Multi-zone uptime monitoring for developers and sysadmins. Confirmed across zones, so a bad network path doesn't page you at 3am."
		/>
		<!-- Social previews. og:image is root-relative; set an absolute URL once the
		     prod domain is fixed, if a scraper needs it. -->
		<meta property="og:site_name" content="nabz" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="nabz — The pulse of your infrastructure" />
		<meta
			property="og:description"
			content="Multi-zone uptime monitoring for developers and sysadmins. Confirmed across zones, so a bad network path doesn't page you at 3am."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="nabz — The pulse of your infrastructure" />
		<meta
			name="twitter:description"
			content="Multi-zone uptime monitoring for developers and sysadmins. Confirmed across zones, so a bad network path doesn't page you at 3am."
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/og-image.png" />
		<script>
			// Apply saved theme/accent before first paint (no flash).
			try {
				var d = document.documentElement;
				var t = localStorage.getItem('wm-theme');
				var a = localStorage.getItem('wm-accent');
				if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
				if (a) d.setAttribute('data-accent', a);
				// Bridge to Tailwind's .dark class (for flowbite's dark: variants).
				var dark =
					t === 'dark' ||
					(t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) d.classList.add('dark');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="margin: 0; background: #ecf0f1">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
